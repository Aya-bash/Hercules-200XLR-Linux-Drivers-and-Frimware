[workspace]
resolver = "2"
members = [
    "crates/hsm200-driver",
    "crates/hsm200-control",
    "crates/hsm200-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Aya-bash/Hercules-200XLR-Linux-Drivers-and-Frimware"

[workspace.dependencies]
rusb = "0.9"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
ctrlc = "3.4"
eframe = "0.30"
egui = "0.30"
rfd = "0.15"
